<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <!--Password Container-->
    <div class="container">
       <h1>Password Generator</h1>
       <div class="password-container"></div>
       <input type="text" readonly id="password">
       <i class="far fa-copy" id="copy-btn" title="Copy to Clipboard"></i>
       <!---Options-->
       <div class="options">
        <!---password length-->
        <div class="option">
            <label for="Lenght">Password Length</label>
            <div class="range-container">
                <input type="range" id="length" min="5" max="25" value="12">
                <span id="length-value">12</span>
            </div>
        </div>
        <!--Include Uppercase-->
        <div class="option">
            <label for="uppercase">Include Uppercase</label>
            <input type="checkbox" id="uppercase" checked>
        </div>
                <!--Include Lowercasee-->
        <div class="option">
            <label for="lowercase">Include Lowercase</label>
            <input type="checkbox" id="lowercase" checked>
        </div>
              <!--Include Numbers-->
        <div class="option">
            <label for="numbers">Include Numbers</label>
            <input type="checkbox" id="numbers" checked>
        </div>
        <div class="option">
            <label for="symbols">Include Symbols</label>
            <input type="checkbox" id="symbols" checked>
        </div>
       </div>
       <button id="generate-btn">
        <i class="fas fa-key"></i>
        Generate Password
    </button>
    
    <div class="strength-container">
        <p>Password Strength: <span id="strength-label">Medium</span></p>
    </div>
    <div class="strength-meter">
        <div class="strength-bar-container">
            <div class="strength-bar"></div>
        </div>
    </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
